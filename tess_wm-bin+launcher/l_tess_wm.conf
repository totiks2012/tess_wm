# l_tess_wm.conf — конфиг для l_tess_wm.sh (лежит рядом со скриптом).
# Задайте команду запуска вашего терминала с заголовком и командой wm-tview.
# Если TESS_TERMINAL_CMD закомментирован — скрипт сам найдёт первый из
# доступных: xfce4-terminal, alacritty, kitty, xterm.

TESS_TERMINAL_CMD="xfce4-terminal -T TessWorkspace -e 'me tess_wm'"
# Примеры для других терминалов (раскомментируйте нужный):
# TESS_TERMINAL_CMD="alacritty -t TessWorkspace -e me tess_wm"
# TESS_TERMINAL_CMD="kitty --title TessWorkspace me tess_wm"
# TESS_TERMINAL_CMD="xterm -title TessWorkspace -e me tess_wm"


# Заголовок окна (по нему wmctrl ищет окно).
TESS_WIN_TITLE="TessWorkspace"

# 1 = раскрыть на рабочую область без панели (WA/EWMH); 0 = максимизация во весь экран.
TESS_WORKAREA=1

